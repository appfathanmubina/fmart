name: FMart Regression

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Static and business-rule regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: node --check < apps-script/Code.gs
      - name: Check service worker syntax
        run: node --check service-worker.js
      - name: Run regression tests
        run: node --test tests/fmart-regression.test.cjs
      - name: Check patch whitespace
        run: git diff --check
