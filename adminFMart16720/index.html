<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#800080">
  <meta name="description" content="Panel petugas FMart.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../icons/fmart-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="../icons/fmart-180.png" sizes="180x180">
  <title>FMart Admin</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#241b35;background:#f3eaf5;font-synthesis:none;text-rendering:optimizeLegibility}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden}
    .app-frame{position:fixed;inset:0;width:100%;height:100vh;box-sizing:border-box;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);border:0;background:#f3eaf5}@supports(height:100dvh){.app-frame{height:100dvh}}
    .setup{max-width:560px;margin:12vh auto;padding:24px}.setup h1{color:#800080}.setup p{line-height:1.6}.setup code{overflow-wrap:anywhere}
    .status{position:fixed;z-index:2;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241b35;color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;box-shadow:0 8px 28px #0002}.status[hidden]{display:none}
    html.fmart-shell-framed body>*{display:none!important}html.fmart-shell-framed body::before{content:"Panel FMart tidak dapat disematkan di situs lain.";position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:28px;text-align:center;font:600 16px/1.5 system-ui;color:#800080;background:#f3eaf5}
  </style>
  <script>if(window.top!==window.self)document.documentElement.classList.add("fmart-shell-framed");</script>
</head>
<body>
  <main id="setup" class="setup" hidden></main>
  <iframe id="app" class="app-frame" title="Panel Admin FMart" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin" hidden></iframe>
  <div id="status" class="status" role="status" hidden></div>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script src="../config.js"></script>
  <script>
    const setup=document.querySelector("#setup"),frame=document.querySelector("#app"),status=document.querySelector("#status");
    window.OneSignalDeferred=window.OneSignalDeferred||[];let fmartOneSignalExternalId="";
    window.OneSignalDeferred.push(async function(OneSignal){await OneSignal.init({appId:"45d38692-f97f-4e94-8d71-6b3e9a4c8c5f",safari_web_id:"web.onesignal.auto.56dcd4fd-a138-4c52-be69-7f4de2370515",serviceWorkerPath:"/fmart/service-worker.js",serviceWorkerParam:{scope:"/fmart/"},notifyButton:{enable:false}});window.FMART_ONESIGNAL_READY=true});
    const endpoint=String(window.FMART_APP_URL||"").trim();
    if(/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(endpoint)){
      const portalUrl=new URL(endpoint);portalUrl.searchParams.set("portal","ADMINFMART16720");frame.src=portalUrl.toString();frame.hidden=false;
    }else{
      setup.hidden=false;setup.innerHTML="<h1>Panel Admin FMart</h1><p>URL deployment Apps Script belum dikonfigurasi pada <code>config.js</code>.</p>";
    }
    if("serviceWorker" in navigator)navigator.serviceWorker.register("../service-worker.js").catch(()=>{});
    let deferredInstallPrompt=null;
    function sendInstallState(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'FMART_INSTALL_STATE',available:!!deferredInstallPrompt,installed:window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true},'*')}
    frame.addEventListener('load',sendInstallState);
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;sendInstallState()});
    window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;if(frame.contentWindow)frame.contentWindow.postMessage({type:'FMART_INSTALL_DONE'},'*');sendInstallState()});
    window.addEventListener('message',async event=>{
      if(event.source!==frame.contentWindow)return;
      const data=event.data||{};
      if(data.type==='FMART_ONESIGNAL_LOGIN'){fmartOneSignalExternalId=String(data.externalId||"");window.OneSignalDeferred.push(async OneSignal=>{if(fmartOneSignalExternalId)await OneSignal.login(fmartOneSignalExternalId)});return;}
      if(data.type==='FMART_ONESIGNAL_LOGOUT'){fmartOneSignalExternalId="";window.OneSignalDeferred.push(async OneSignal=>{await OneSignal.logout()});return;}
      if(data.type==='FMART_ONESIGNAL_ENABLE'){window.OneSignalDeferred.push(async OneSignal=>{try{if(!OneSignal.Notifications.isPushSupported())throw new Error("Perangkat atau browser ini belum mendukung notifikasi push.");const granted=await OneSignal.Notifications.requestPermission();if(granted)await OneSignal.User.PushSubscription.optIn();frame.contentWindow.postMessage({type:"FMART_ONESIGNAL_STATUS",status:granted?"enabled":"denied"},"*")}catch(error){frame.contentWindow.postMessage({type:"FMART_ONESIGNAL_STATUS",status:"error",message:error&&error.message?error.message:"Notifikasi belum dapat diaktifkan."},"*")}});return;}
      if(data.type==='FMART_INSTALL_READY'){sendInstallState();return}

      if(data.type!=='FMART_INSTALL_REQUEST')return;
      if(!deferredInstallPrompt){frame.contentWindow.postMessage({type:'FMART_INSTALL_RESULT',status:'unavailable'},'*');return}
      const promptEvent=deferredInstallPrompt;deferredInstallPrompt=null;
      try{await promptEvent.prompt();const choice=await promptEvent.userChoice;frame.contentWindow.postMessage({type:'FMART_INSTALL_RESULT',status:choice&&choice.outcome==='accepted'?'accepted':'dismissed'},'*')}
      catch(error){frame.contentWindow.postMessage({type:'FMART_INSTALL_RESULT',status:'unavailable'},'*')}
      sendInstallState();
    });
    let offlineTimer;
    function updateNetwork(){clearTimeout(offlineTimer);if(!navigator.onLine){status.textContent="Anda sedang offline. Koneksi ke layanan FMart diperlukan.";status.hidden=false}else if(!status.hidden){status.textContent="Koneksi kembali";offlineTimer=setTimeout(()=>status.hidden=true,2200)}}
    window.addEventListener("online",updateNetwork);window.addEventListener("offline",updateNetwork);updateNetwork();
  </script>
</body>
</html>
